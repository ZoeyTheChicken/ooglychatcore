openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.4.0
  description: Oogly Chat API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: messages
    description: Chat messages
  - name: users
    description: User management
  - name: bans
    description: Ban management
  - name: mutes
    description: Mute management
  - name: appeals
    description: Ban/mute appeals
  - name: announcements
    description: Announcements
  - name: reactions
    description: Message reactions
  - name: moderation
    description: Moderation logs
  - name: admin
    description: Admin panel operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user session
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  # Messages
  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages (paginated, newest first)
      parameters:
        - in: query
          name: before
          schema:
            type: integer
          description: Cursor for pagination (message id)
        - in: query
          name: limit
          schema:
            type: integer
          description: Max number of messages to return
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Bad request (e.g. filtered content)
        "403":
          description: Forbidden (banned or muted)

  /messages/{id}:
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete a message (admin or own)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # Reactions
  /messages/{id}/reactions:
    post:
      operationId: addReaction
      tags: [reactions]
      summary: Add a reaction to a message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "201":
          description: Reaction added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"

  /messages/{id}/reactions/{emoji}:
    delete:
      operationId: removeReaction
      tags: [reactions]
      summary: Remove a reaction from a message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: emoji
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  /messages/{id}/reactions/summary:
    get:
      operationId: getReactionSummary
      tags: [reactions]
      summary: Get reaction counts per emoji for a message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reaction summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReactionSummary"

  # Users
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin or self)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/settings:
    patch:
      operationId: updateSettings
      tags: [users]
      summary: Update current user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # Bans
  /bans:
    get:
      operationId: listBans
      tags: [bans]
      summary: List all bans (admin)
      parameters:
        - in: query
          name: active
          schema:
            type: boolean
      responses:
        "200":
          description: Bans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ban"

    post:
      operationId: banUser
      tags: [bans]
      summary: Ban a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanInput"
      responses:
        "201":
          description: Banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ban"

  /bans/{id}:
    delete:
      operationId: unbanUser
      tags: [bans]
      summary: Remove a ban (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unbanned

  /users/{id}/ban-status:
    get:
      operationId: getUserBanStatus
      tags: [bans]
      summary: Get ban status for a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ban status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanStatus"

  # Mutes
  /mutes:
    get:
      operationId: listMutes
      tags: [mutes]
      summary: List all mutes (admin)
      parameters:
        - in: query
          name: active
          schema:
            type: boolean
      responses:
        "200":
          description: Mutes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mute"

    post:
      operationId: muteUser
      tags: [mutes]
      summary: Mute a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuteInput"
      responses:
        "201":
          description: Muted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mute"

  /mutes/{id}:
    delete:
      operationId: unmuteUser
      tags: [mutes]
      summary: Remove a mute (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unmuted

  # Appeals
  /appeals:
    get:
      operationId: listAppeals
      tags: [appeals]
      summary: List all appeals (admin)
      parameters:
        - in: query
          name: unread
          schema:
            type: boolean
      responses:
        "200":
          description: Appeals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appeal"

    post:
      operationId: submitAppeal
      tags: [appeals]
      summary: Submit an appeal (banned/muted user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealInput"
      responses:
        "201":
          description: Appeal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appeal"

  /appeals/{id}/read:
    patch:
      operationId: markAppealRead
      tags: [appeals]
      summary: Mark appeal as read (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appeal"

  /appeals/{id}/dismiss:
    patch:
      operationId: dismissAppeal
      tags: [appeals]
      summary: Dismiss an appeal (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appeal"

  # Announcements
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List announcements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"

    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create an announcement (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /announcements/{id}:
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Delete announcement (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Moderation Logs
  /moderation-logs:
    get:
      operationId: listModerationLogs
      tags: [moderation]
      summary: List moderation logs (admin)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: adminId
          schema:
            type: integer
        - in: query
          name: targetUserId
          schema:
            type: integer
      responses:
        "200":
          description: Moderation logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationLogListResponse"

  # Admin stats
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/online-users:
    get:
      operationId: getOnlineUsers
      tags: [admin]
      summary: Get recently active users
      responses:
        "200":
          description: Online users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  # Filter check
  /filter/check:
    post:
      operationId: checkFilter
      tags: [admin]
      summary: Test a string against the swear filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterCheckInput"
      responses:
        "200":
          description: Filter result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterCheckResult"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # Auth
    RegisterInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 6

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    # User
    User:
      type: object
      required: [id, username, isAdmin, isOwner, isMuted, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        isAdmin:
          type: boolean
        isOwner:
          type: boolean
        isMuted:
          type: boolean
        theme:
          type: ["string", "null"]
        notificationsEnabled:
          type: ["boolean", "null"]
        soundsEnabled:
          type: ["boolean", "null"]
        compactMode:
          type: ["boolean", "null"]
        lastSeen:
          type: ["string", "null"]
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        isAdmin:
          type: boolean
        isOwner:
          type: boolean

    UserListResponse:
      type: object
      required: [users, total]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer

    SettingsUpdate:
      type: object
      properties:
        theme:
          type: string
        notificationsEnabled:
          type: boolean
        soundsEnabled:
          type: boolean
        compactMode:
          type: boolean

    # Messages
    Message:
      type: object
      required: [id, content, authorId, authorUsername, deleted, createdAt]
      properties:
        id:
          type: integer
        content:
          type: string
        authorId:
          type: integer
        authorUsername:
          type: string
        deleted:
          type: boolean
        replyToId:
          type: ["integer", "null"]
        replyToContent:
          type: ["string", "null"]
        replyToUsername:
          type: ["string", "null"]
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionSummary"
        createdAt:
          type: string

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        replyToId:
          type: integer

    # Reactions
    Reaction:
      type: object
      required: [id, messageId, userId, emoji, createdAt]
      properties:
        id:
          type: integer
        messageId:
          type: integer
        userId:
          type: integer
        emoji:
          type: string
        createdAt:
          type: string

    ReactionInput:
      type: object
      required: [emoji]
      properties:
        emoji:
          type: string

    ReactionSummary:
      type: object
      required: [emoji, count, userReacted]
      properties:
        emoji:
          type: string
        count:
          type: integer
        userReacted:
          type: boolean

    # Bans
    Ban:
      type: object
      required: [id, userId, reason, isPermanent, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: ["string", "null"]
        bannedById:
          type: ["integer", "null"]
        bannedByUsername:
          type: ["string", "null"]
        reason:
          type: string
        isPermanent:
          type: boolean
        expiresAt:
          type: ["string", "null"]
        createdAt:
          type: string

    BanInput:
      type: object
      required: [userId, reason]
      properties:
        userId:
          type: integer
        reason:
          type: string
          minLength: 1
        isPermanent:
          type: boolean
        expiresAt:
          type: ["string", "null"]

    BanStatus:
      type: object
      required: [isBanned]
      properties:
        isBanned:
          type: boolean
        ban:
          $ref: "#/components/schemas/Ban"

    # Mutes
    Mute:
      type: object
      required: [id, userId, reason, isPermanent, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: ["string", "null"]
        mutedById:
          type: ["integer", "null"]
        mutedByUsername:
          type: ["string", "null"]
        reason:
          type: string
        isPermanent:
          type: boolean
        expiresAt:
          type: ["string", "null"]
        createdAt:
          type: string

    MuteInput:
      type: object
      required: [userId, reason]
      properties:
        userId:
          type: integer
        reason:
          type: string
          minLength: 1
        isPermanent:
          type: boolean
        expiresAt:
          type: ["string", "null"]

    # Appeals
    Appeal:
      type: object
      required: [id, userId, message, isRead, isDismissed, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: ["string", "null"]
        message:
          type: string
        isRead:
          type: boolean
        isDismissed:
          type: boolean
        createdAt:
          type: string

    AppealInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 10
          maxLength: 2000

    # Announcements
    Announcement:
      type: object
      required: [id, content, authorId, createdAt]
      properties:
        id:
          type: integer
        content:
          type: string
        authorId:
          type: integer
        authorUsername:
          type: ["string", "null"]
        createdAt:
          type: string

    AnnouncementInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000

    # Moderation Logs
    ModerationLog:
      type: object
      required: [id, adminUsername, action, createdAt]
      properties:
        id:
          type: integer
        adminId:
          type: ["integer", "null"]
        adminUsername:
          type: string
        targetUserId:
          type: ["integer", "null"]
        targetUsername:
          type: ["string", "null"]
        action:
          type: string
        reason:
          type: ["string", "null"]
        metadata:
          type: ["object", "null"]
        createdAt:
          type: string

    ModerationLogListResponse:
      type: object
      required: [logs, total]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/ModerationLog"
        total:
          type: integer

    # Admin
    AdminStats:
      type: object
      required: [totalUsers, totalMessages, activeBans, activeMutes, pendingAppeals, messagesLast24h, newUsersLast24h]
      properties:
        totalUsers:
          type: integer
        totalMessages:
          type: integer
        activeBans:
          type: integer
        activeMutes:
          type: integer
        pendingAppeals:
          type: integer
        messagesLast24h:
          type: integer
        newUsersLast24h:
          type: integer

    # Filter
    FilterCheckInput:
      type: object
      required: [text]
      properties:
        text:
          type: string

    FilterCheckResult:
      type: object
      required: [flagged, matches, cleaned]
      properties:
        flagged:
          type: boolean
        matches:
          type: array
          items:
            type: string
        cleaned:
          type: string
